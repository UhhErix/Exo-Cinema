name: Bug report
description: Something in Exo Cinema doesn't work right
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...
2. Click ...
3. See ..."
  - type: input
    attributes:
      label: Exo Cinema version
      placeholder: Settings > About
    validations:
      required: true
  - type: input
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    attributes:
      label: Logs or screenshots
