<!doctype html>
<html lang="en" data-exo-theme="void">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exo Cinema</title>
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="profile-cinema.css">
  <link rel="stylesheet" href="player.css">
  <link rel="stylesheet" href="boot.css">
  <link rel="icon" href="favicon.svg">
</head>
<body class="mode-app">
  <!-- The opening: the page's first frame, so it is drawn before any script runs (boot.js plays it, app.js lifts it
       once the first screen is ready). -->
  <div class="exo-boot" id="boot" role="status" aria-label="Opening Exo Cinema">
    <img class="exo-boot-icon" src="logo.svg" width="128" height="128" alt="" draggable="false" decoding="sync">
  </div>

  <div id="app">
    <!-- The Bar, as Exo Launcher's (TitleBar.tsx): Search (Ctrl+K), the libraries, and Tools with the window controls. -->
    <header class="bar">
      <button class="exo-glass bar-search" id="openSearch" type="button" aria-label="Search" aria-keyshortcuts="Control+K">
        <img class="bar-mark" src="mark.svg" width="20" height="20" alt="" draggable="false"><span>Search</span>
      </button>
      <nav class="exo-glass rooms" id="rooms" aria-label="Libraries"></nav>
      <div class="exo-glass tools">
        <button class="tool-btn profile-btn" id="profileBtn" type="button" aria-label="Settings"><span class="avatar" id="avatar"></span></button>
        <span class="window-controls" data-window-controls></span>
      </div>
    </header>
    <!-- Settings: a sheet over the room it was opened from, as Exo Launcher's (SettingsPanel.tsx): a sidebar of pages,
         then the page it names. A solid black slab with the one hairline, over the scrim; nothing shows through it. -->
    <div class="settings-back" id="settings" hidden>
      <section class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" tabindex="-1">
        
        <nav class="settings-nav" aria-label="Settings pages">
          <h1 class="settings-nav-title" id="settingsTitle">Settings</h1>
          <ul id="settingsNav"></ul>
        </nav>
        <div class="settings-main">
          <h2 class="settings-title" id="settingsPageTitle"></h2>
          <button type="button" class="set-btn is-compact settings-close" id="settingsClose" aria-label="Close settings"><svg data-glyph="x"></svg></button>
          <div class="settings-scroll" id="settingsBody"></div>
        </div>
      </section>
    </div>
    <main id="view" tabindex="-1"></main>
  </div>

  <!-- Ctrl+K: search your Jellyfin server. -->
  <div class="palette" id="palette" hidden>
    <div class="palette-scrim" data-close-palette></div>
    <div class="exo-glass is-panel palette-panel" role="dialog" aria-label="Search">
      <label class="palette-field"><svg data-glyph="search"></svg><input id="paletteInput" type="search" placeholder="Search" autocomplete="off" spellcheck="false" role="combobox" aria-controls="paletteResults"></label>
      <div class="palette-results" id="paletteResults" role="listbox"></div>
    </div>
  </div>

  <!-- The first run (onboarding.js): Welcome, the Exo account and Jellyfin, as Exo Launcher's. -->
  <section class="ob" id="onboarding" hidden>
    <header class="ob-band">
      <div class="exo-glass capsule tools-capsule"><span class="window-controls" data-window-controls></span></div>
    </header>
    <div class="ob-column">
      <div class="ob-progress" id="obProgress" role="progressbar" aria-label="Setup" aria-valuemin="0" aria-valuemax="4"><span></span></div>
      <div class="ob-step" id="obStep"></div>
      <footer class="ob-foot">
        <p class="ob-note" id="obNote" role="status"></p>
        <button type="button" class="ob-back" id="obBack">Back</button>
        <button type="button" class="primary is-primary ob-cta" id="obNext">Get started</button>
      </footer>
    </div>
  </section>

  <!-- The Changelog: after an update, and from Settings › About (updates.js). -->
  <div class="whats-new" id="whatsNew" hidden>
    <div class="whats-new-scrim"></div>
    <header class="signin-bar"><div class="exo-glass capsule tools-capsule"><span class="window-controls" data-window-controls></span></div></header>
    <section class="exo-glass is-panel whats-new-sheet" role="dialog" aria-modal="true" aria-labelledby="whatsNewTitle" tabindex="-1">
      <h2 id="whatsNewTitle"></h2>
      <div class="whats-new-list" id="whatsNewList"></div>
      <footer class="whats-new-foot">
        <button type="button" class="primary is-primary" id="whatsNewContinue">Continue</button>
        <button type="button" class="primary is-primary" id="whatsNewInstall" hidden>Install update</button>
      </footer>
    </section>
  </div>

  <!-- "Exo now has accounts", once for someone who had Exo Cinema before accounts (app.js maybeAccountOffer). -->
  <div class="whats-new account-offer" id="accountOffer" hidden>
    <div class="whats-new-scrim"></div>
    <header class="signin-bar"><div class="exo-glass capsule tools-capsule"><span class="window-controls" data-window-controls></span></div></header>
    <section class="exo-glass is-panel whats-new-sheet account-offer-sheet" role="dialog" aria-modal="true" aria-labelledby="accountOfferTitle" tabindex="-1">
      <div data-offer-intro>
        <img class="account-offer-logo" src="logo.svg" alt="" width="56" height="56" draggable="false">
        <h2 id="accountOfferTitle">Exo now has accounts</h2>
        <ul class="account-offer-points">
          <li>Your settings on every PC</li>
          <li>One account for every Exo app</li>
        </ul>
        <div class="account-offer-actions">
          <button type="button" class="set-btn" data-offer="not-now">Not now</button>
          <button type="button" class="set-btn" data-offer="signin">Sign in</button>
          <button type="button" class="set-btn is-primary" data-offer="create">Create account</button>
        </div>
      </div>
      <div class="account-offer-form" data-offer-form hidden></div>
    </section>
  </div>

  <!-- A newer Exo Cinema, offered as the app opens (updates.js): Update now installs it and opens it again. -->
  <div class="whats-new update-offer" id="updateOffer" hidden>
    <div class="whats-new-scrim"></div>
    <header class="signin-bar"><div class="exo-glass capsule tools-capsule"><span class="window-controls" data-window-controls></span></div></header>
    <section class="exo-glass is-panel whats-new-sheet" role="dialog" aria-modal="true" aria-labelledby="updateOfferTitle" aria-describedby="updateOfferVersion" tabindex="-1">
      <div class="update-head"><h2 id="updateOfferTitle">Update available</h2><p class="update-version" id="updateOfferVersion"></p></div>
      <footer class="update-foot" id="updateOfferFoot"></footer>
    </section>
  </div>

  <!-- Which version to play, from the chevron beside Play (app.js › pickSource): a menu that grows from the
       Play that was pressed, as every choice of several does, never a dialog. -->
  <div class="exo-glass is-panel is-menu sources-menu" id="sources" role="listbox" aria-label="Choose a version" hidden></div>

  <main id="stage">
    <header class="top">
      <div class="exo-glass is-over-art capsule title-capsule" data-over-video>
        <button class="icon" data-action="back" aria-label="Back"><svg data-glyph="chevron-left"></svg></button>
        <span id="title"></span>
      </div>
      <div class="exo-glass is-over-art capsule tools" data-over-video>
        <button class="icon" data-action="tracks" aria-label="Audio, subtitles and speed" aria-haspopup="menu"><svg data-glyph="adjustments-horizontal"></svg></button>
        <button class="icon" data-action="info" aria-label="Details"><svg data-glyph="info"></svg></button>
        <button class="icon" data-action="fullscreen" aria-label="Full screen"><svg data-glyph="arrows-maximize"></svg></button>
        <span class="window-controls" data-window-controls></span>
      </div>
    </header>

    <footer class="exo-glass is-over-art controls" data-over-video>
      <button class="play is-primary" data-action="pause" aria-label="Play"><svg data-glyph="player-play-filled"></svg></button>
      <span class="time" id="pos">0:00</span>
      <div class="scrub" id="scrub" role="slider" aria-label="Position" tabindex="0">
        <div class="track"><div class="cached" id="cached"></div><div class="played" id="played"></div></div>
        <div class="thumb-rail" id="thumbRail"><div class="thumb"></div></div>
        <div class="exo-glass is-over-art hover-peek" id="hoverPeek"><div class="peek-frame" id="peekFrame"></div><span class="peek-time" id="hoverTime"></span></div>
      </div>
      <span class="time" id="dur">0:00</span>
      <div class="volume" role="group" aria-label="Volume">
        <button class="icon" data-action="mute" aria-label="Mute"><svg data-glyph="volume"></svg></button>
        <input type="range" class="is-compact" id="volume" min="0" max="100" step="1" value="100" aria-label="Volume" aria-valuetext="100 percent">
      </div>
    </footer>

    <aside class="exo-glass is-panel readings" id="readings" data-over-video hidden></aside>
    <div class="exo-glass is-panel track-menu" id="trackMenu" data-over-video role="menu" hidden></div>
    <button class="exo-glass is-over-art skip-btn" id="skipBtn" data-over-video type="button" hidden><span></span><svg data-glyph="player-skip-forward-filled"></svg></button>
    <div class="exo-glass is-panel up-next" id="upNext" data-over-video hidden></div>
    <div class="spinner" id="spinner" hidden></div>
  </main>

  <script src="boot.js"></script>
  <script src="icons.js"></script>
  <script src="player.js"></script>
  <script src="window.js"></script>
  <script src="profile-effect.js"></script>
  <script src="app.js"></script>
  <script src="profile-canvas.js"></script>
  <script src="profile.js"></script>
  <script src="onboarding.js"></script>
  <script src="updates.js"></script>
  <script src="playerplus.js"></script>
</body>
</html>
